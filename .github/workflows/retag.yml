name: Move a release tag (one-off)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to move
        required: true
      sha:
        description: Commit the tag should point to
        required: true

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$TAG" -f sha="$SHA" -F force=true
